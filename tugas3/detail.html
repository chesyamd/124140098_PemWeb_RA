<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Detail Informasi Pendaftar</title>
	<style>
		:root {
			color-scheme: light;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #202723;
			background: #f7eff2;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			padding: 64px 20px;
			background: linear-gradient(145deg, #fff9fb 0%, #f4e9ee 100%);
		}

		main {
			width: min(100%, 760px);
			margin: 0 auto;
		}

		header {
			margin-bottom: 24px;
		}

		.eyebrow {
			margin: 0 0 8px;
			color: #a96883;
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(28px, 5vw, 36px);
			font-weight: 650;
			line-height: 1.2;
		}

		.detail-panel {
			overflow: hidden;
			border: 1px solid #ead9e0;
			border-radius: 12px;
			background: #ffffff;
			box-shadow: 0 12px 32px rgb(90 54 69 / 8%);
		}

		table {
			width: 100%;
			border-collapse: collapse;
			text-align: left;
		}

		caption {
			padding: 20px 24px;
			border-bottom: 1px solid #f0e3e8;
			color: #a96883;
			font-size: 14px;
			font-weight: 650;
			text-align: left;
		}

		th,
		td {
			padding: 16px 24px;
			border-bottom: 1px solid #f2e9ed;
			vertical-align: top;
			line-height: 1.55;
		}

		tbody tr:last-child th,
		tbody tr:last-child td {
			border-bottom: 0;
		}

		th {
			width: 32%;
			color: #826d76;
			font-size: 14px;
			font-weight: 550;
		}

		td {
			color: #202723;
			font-size: 15px;
			overflow-wrap: anywhere;
		}

		@media (max-width: 520px) {
			body {
				padding: 40px 16px;
			}

			th,
			td {
				padding: 14px 16px;
			}

			th {
				width: 40%;
			}
		}
	</style>
</head>
<body>
	<main>
		<header>
			<p class="eyebrow">Pendaftaran Mahasiswa</p>
			<h1>Detail Informasi Pendaftar</h1>
		</header>

		<section class="detail-panel" aria-label="Informasi pendaftar">
			<table>
				<caption>Data pendaftar</caption>
				<tbody>
					<tr>
						<th scope="row">Nama Lengkap</th>
						<td>Bebih Gemush</td>
					</tr>
					<tr>
						<th scope="row">NIM</th>
						<td>123456789</td>
					</tr>
					<tr>
						<th scope="row">Email</th>
						<td>bebih.gemush@example.com</td>
					</tr>
					<tr>
						<th scope="row">Program Studi</th>
						<td>Informatika</td>
					</tr>
					<tr>
						<th scope="row">Jenis Kelamin</th>
						<td>Laki-laki</td>
					</tr>
					<tr>
						<th scope="row">Minat atau Bidang</th>
						<td>Hacking</td>
					</tr>
					<tr>
						<th scope="row">Deskripsi</th>
						<td>Saya mau jadi hacker seperti hacker rusia hoho</td>
					</tr>
				</tbody>
			</table>
		</section>
	</main>
</body>
</html>
