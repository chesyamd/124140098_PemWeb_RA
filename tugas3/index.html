<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formulir Pendaftaran Mahasiswa</title>
	<style>
		:root {
			color-scheme: light;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #202723;
			background: #f7eff2;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			padding: 64px 20px;
			background: linear-gradient(145deg, #fff9fb 0%, #f4e9ee 100%);
		}

		header,
		main {
			width: min(100%, 760px);
			margin-right: auto;
			margin-left: auto;
		}

		header {
			margin-bottom: 24px;
		}

		h1 {
			margin: 0 0 8px;
			font-size: clamp(28px, 5vw, 36px);
			font-weight: 650;
			line-height: 1.2;
		}

		header p {
			margin: 0;
			color: #826d76;
			font-size: 15px;
			line-height: 1.55;
		}

		form {
			padding: 24px;
			border: 1px solid #ead9e0;
			border-radius: 12px;
			background: #ffffff;
			box-shadow: 0 12px 32px rgb(90 54 69 / 8%);
		}

		form p {
			margin: 0 0 20px;
		}

		label,
		legend {
			color: #69535d;
			font-size: 14px;
			font-weight: 550;
		}

		input:not([type="radio"]),
		select,
		textarea {
			width: 100%;
			margin-top: 8px;
			padding: 11px 12px;
			border: 1px solid #e2cbd5;
			border-radius: 8px;
			background: #ffffff;
			color: #202723;
			font: inherit;
			font-size: 15px;
		}

		input:not([type="radio"]):focus,
		select:focus,
		textarea:focus {
			border-color: #b98299;
			outline: 3px solid rgb(185 130 153 / 18%);
		}

		select {
			cursor: pointer;
		}

		input[list] {
			appearance: auto;
		}

		datalist option {
			color: #202723;
		}

		fieldset {
			margin: 0 0 20px;
			padding: 14px 16px;
			border: 1px solid #ead9e0;
			border-radius: 8px;
		}

		legend {
			padding: 0 6px;
		}

		input[type="radio"] {
			width: 16px;
			height: 16px;
			margin: 10px 6px 0 0;
			accent-color: #a96883;
			vertical-align: -3px;
		}

		fieldset label {
			margin-right: 18px;
			font-weight: 400;
		}

		textarea {
			min-height: 120px;
			resize: vertical;
		}

		button {
			min-height: 42px;
			padding: 10px 16px;
			border: 1px solid #e2cbd5;
			border-radius: 8px;
			background: #faf4f6;
			color: #684c5a;
			font: inherit;
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
		}

		button:hover {
			background: #f3e6ec;
		}

		button[type="submit"] {
			margin-left: 8px;
			border-color: #a96883;
			background: #a96883;
			color: #ffffff;
		}

		button[type="submit"]:hover {
			background: #92566f;
		}

		button:focus-visible {
			outline: 3px solid rgb(169 104 131 / 30%);
			outline-offset: 2px;
		}

		@media (max-width: 520px) {
			body {
				padding: 40px 16px;
			}

			form {
				padding: 20px 16px;
			}
		}
	</style>
</head>
<body>
	<header>
		<h1>Formulir Pendaftaran Mahasiswa</h1>
		<p>Silakan isi data diri Anda dengan lengkap.</p>
	</header>

	<main>
		<form action="detail.html" method="get">
			<p>
				<label for="nama">Nama lengkap:</label><br>
				<input type="text" id="nama" name="nama" required>
			</p>

			<p>
				<label for="nim">NIM:</label><br>
				<input type="text" id="nim" name="nim" required>
			</p>

			<p>
				<label for="email">Email:</label><br>
				<input type="email" id="email" name="email" required>
			</p>

			<p>
				<label for="program-studi">Program studi:</label><br>
				<select id="program-studi" name="program_studi" required>
					<option value="">Pilih program studi</option>
					<option value="informatika">Informatika</option>
					<option value="sistem-informasi">Sistem Informasi</option>
					<option value="manajemen">Manajemen</option>
					<option value="akuntansi">Akuntansi</option>
				</select>
			</p>

			<fieldset>
				<legend>Jenis kelamin:</legend>
				<input type="radio" id="laki-laki" name="jenis_kelamin" value="laki-laki" required>
				<label for="laki-laki">Laki-laki</label>
				<input type="radio" id="perempuan" name="jenis_kelamin" value="perempuan">
				<label for="perempuan">Perempuan</label>
			</fieldset>

			<p>
				<label for="minat">Minat atau bidang yang disukai:</label><br>
				<input type="text" id="minat" name="minat" list="daftar-minat">
				<datalist id="daftar-minat">
					<option value="Pemrograman">
					<option value="Desain">
					<option value="Jaringan komputer">
					<option value="Data science">
				</datalist>
			</p>

			<p>
				<label for="deskripsi">Deskripsi singkat:</label><br>
				<textarea id="deskripsi" name="deskripsi" rows="5" cols="40"></textarea>
			</p>

			<button type="reset">Reset</button>
			<button type="submit">Daftar</button>
		</form>
	</main>
</body>
</html>
